<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NoticeShield - Upload</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {
                        "tertiary": "#313436",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#001c37",
                        "background": "#f8f9ff",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#474b4d",
                        "on-tertiary-fixed": "#191c1e",
                        "error": "#ba1a1a",
                        "secondary-fixed": "#98f1fa",
                        "on-surface": "#0d1c2f",
                        "primary-fixed-dim": "#a0c9ff",
                        "surface-container-low": "#eff4ff",
                        "on-surface-variant": "#42474f",
                        "surface-bright": "#f8f9ff",
                        "inverse-surface": "#233144",
                        "primary-container": "#0f4c81",
                        "secondary-container": "#98f1fa",
                        "on-secondary-container": "#006f78",
                        "secondary-fixed-dim": "#7cd4de",
                        "inverse-on-surface": "#ebf1ff",
                        "surface-dim": "#ccdbf4",
                        "tertiary-fixed-dim": "#c4c7c9",
                        "surface-variant": "#d5e3fd",
                        "surface-container": "#e6eeff",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-fixed": "#d2e4ff",
                        "on-primary-fixed-variant": "#07497d",
                        "on-tertiary-fixed-variant": "#444749",
                        "surface-container-high": "#dde9ff",
                        "tertiary-fixed": "#e0e3e5",
                        "surface-container-highest": "#d5e3fd",
                        "outline-variant": "#c2c7d1",
                        "on-secondary-fixed-variant": "#004f55",
                        "on-primary": "#ffffff",
                        "surface": "#f8f9ff",
                        "on-tertiary-container": "#b8bbbc",
                        "secondary": "#006971",
                        "inverse-primary": "#a0c9ff",
                        "on-primary-container": "#8ebdf9",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-background": "#0d1c2f",
                        "on-secondary-fixed": "#002023",
                        "surface-tint": "#2d6197",
                        "outline": "#727780",
                        "primary": "#00355f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "margin-mobile": "20px",
                        "gutter-mobile": "16px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "stack-sm": "8px",
                        "touch-target": "48px"
                    },
                    "fontFamily": {
                        "body-md": ["Public Sans"],
                        "label-sm": ["Public Sans"],
                        "display": ["Public Sans"],
                        "h2": ["Public Sans"],
                        "h1": ["Public Sans"],
                        "body-lg": ["Public Sans"],
                        "label-md": ["Public Sans"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "500" }],
                        "display": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h2": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "h1": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],

                }
            }
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md text-body-md pb-24">
<!-- TopAppBar -->
<header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flat no shadows flex justify-between items-center w-full px-5 py-3 docked full-width top-0 sticky z-40">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-blue-800 dark:text-blue-400" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="text-lg font-black text-blue-900 dark:text-blue-100 font-public-sans tracking-tight">NoticeShield</span>
</div>
<div>
<button class="font-public-sans text-sm font-semibold tracking-tight text-blue-800 dark:text-blue-400 hover:bg-slate-50 dark:hover:bg-slate-800 active:scale-95 transition-transform duration-150 px-3 py-1 rounded-full border border-outline-variant">
                Offline
            </button>
</div>
</header>
<main class="px-margin-mobile pt-stack-lg flex flex-col gap-stack-lg max-w-md mx-auto">
<!-- Header Section -->
<div>
<h1 class="font-h1 text-h1 text-on-surface mb-stack-sm">Submit a Notice</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Upload your document securely for instant analysis.</p>
</div>
<!-- Language Selector -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 flex items-center justify-between shadow-[0_4px_12px_rgba(0,53,95,0.05)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">language</span>
<span class="font-label-md text-label-md text-on-surface">Notice Language</span>
</div>
<select class="bg-transparent border-none font-body-md text-body-md text-primary focus:ring-0 cursor-pointer pr-8 py-1">
<option value="en">English</option>
<option value="es">Español</option>
<option value="ar">العربية</option>
</select>
</div>
<!-- Upload Options Bento Grid -->
<div class="grid grid-cols-2 gap-gutter-mobile">
<!-- Take Photo -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-low active:scale-95 transition-all shadow-[0_4px_12px_rgba(0,53,95,0.05)] h-32">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Take Photo</span>
</button>
<!-- Upload File -->
<button class="bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex flex-col items-center justify-center gap-3 hover:bg-surface-container-low active:scale-95 transition-all shadow-[0_4px_12px_rgba(0,53,95,0.05)] h-32">
<div class="w-12 h-12 rounded-full bg-secondary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">upload_file</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Upload File</span>
</button>
<!-- Paste Text -->
<button class="col-span-2 bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex items-center justify-center gap-4 hover:bg-surface-container-low active:scale-95 transition-all shadow-[0_4px_12px_rgba(0,53,95,0.05)] h-touch-target">
<span class="material-symbols-outlined text-on-surface-variant">content_paste</span>
<span class="font-label-md text-label-md text-on-surface">Paste Text Manually</span>
</button>
</div>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="flex-1 h-px bg-outline-variant"></div>
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider">Or Try a Sample</span>
<div class="flex-1 h-px bg-outline-variant"></div>
</div>
<!-- Sample Gallery -->
<div class="flex flex-col gap-3">
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 flex items-center justify-between hover:border-primary active:scale-[0.98] transition-all text-left shadow-[0_2px_8px_rgba(0,53,95,0.03)] border-l-4 border-l-error">
<div>
<span class="font-label-sm text-label-sm text-error bg-error-container px-2 py-0.5 rounded-full mb-1 inline-block">Housing</span>
<h3 class="font-label-md text-label-md text-on-surface">Rent Arrears Notice</h3>
</div>
<span class="material-symbols-outlined text-outline">arrow_forward_ios</span>
</button>
<button class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4 flex items-center justify-between hover:border-primary active:scale-[0.98] transition-all text-left shadow-[0_2px_8px_rgba(0,53,95,0.03)] border-l-4 border-l-[#eab308]">
<div>
<span class="font-label-sm text-label-sm text-[#854d0e] bg-[#fef08a] px-2 py-0.5 rounded-full mb-1 inline-block">Utility</span>
<h3 class="font-label-md text-label-md text-on-surface">Final Disconnect Warning</h3>
</div>
<span class="material-symbols-outlined text-outline">arrow_forward_ios</span>
</button>
</div>
<!-- Primary Action -->
<div class="mt-stack-md pb-stack-lg">
<button class="w-full h-touch-target bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_8px_16px_rgba(0,53,95,0.15)] disabled:opacity-50 disabled:cursor-not-allowed">
<span class="material-symbols-outlined">analytics</span>
                Analyze Notice
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flat no shadows fixed bottom-0 w-full z-50 flex justify-around items-center h-16 px-2 pb-safe md:hidden">
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 py-1.5 px-3 hover:text-blue-700 dark:hover:text-blue-300 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-public-sans text-[11px] font-medium leading-none mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/40 text-blue-900 dark:text-blue-100 rounded-lg py-1.5 px-3 hover:text-blue-700 dark:hover:text-blue-300 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">cloud_upload</span>
<span class="font-public-sans text-[11px] font-medium leading-none mt-1">Upload</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 py-1.5 px-3 hover:text-blue-700 dark:hover:text-blue-300 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-public-sans text-[11px] font-medium leading-none mt-1">History</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-500 dark:text-slate-400 py-1.5 px-3 hover:text-blue-700 dark:hover:text-blue-300 active:scale-90 transition-all duration-200" href="#">
<span class="material-symbols-outlined">help</span>
<span class="font-public-sans text-[11px] font-medium leading-none mt-1">Help</span>
</a>
</nav>
</body></html>
